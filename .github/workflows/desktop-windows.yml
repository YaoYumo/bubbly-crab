name: Windows desktop preflight build
# Explicit installer request: branch bootstrap push plus manual dispatch. No model calls or release publication.
on:
  workflow_dispatch:
  push:
    branches: [arena/3f9ececc-bubbly-crab]
    paths: ['src-tauri/**', 'scripts/prepare-desktop*.ps1', '.github/workflows/desktop-windows.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run test:desktop
      - run: node test/range-interaction.test.mjs
      - run: node test/road-elevation.test.mjs
      - run: node test/radial-menu.test.mjs
      - run: npm run test:editor-expansion:pure
      - run: node test/local-scene-terrain.test.mjs
      - run: node test/camera-edit.test.mjs
      - name: Prepare pinned local inference engine (no model weights)
        shell: pwsh
        run: |
          try { ./scripts/prepare-desktop-engine.ps1 }
          catch {
            $detail = $_.Exception.Message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Pinned engine preparation diagnostic::$detail"
            exit 1
          }
      - name: Build and test isolated blocking loopback helper
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path '.shots' -Force | Out-Null
          ./scripts/prepare-desktop-loopback.ps1 2>&1 | Tee-Object -FilePath .shots/loopback-build.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $detail = (Get-Content .shots/loopback-build.log -Tail 40) -join "`n"
            $detail = $detail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Isolated loopback build diagnostic::$detail"
            exit $code
          }
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Build unsigned x64 installer (downloads WebView2 on user install only if missing)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path '.shots' -Force | Out-Null
          npm run desktop:build 2>&1 | Tee-Object -FilePath .shots/windows-native-build.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $detail = (Get-Content .shots/windows-native-build.log -Tail 110) -join "`n"
            $detail = $detail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Windows build diagnostic::$detail"
            exit $code
          }
      - name: Native local-model boundary unit tests
        shell: pwsh
        run: |
          rustc --test src-tauri/src/local_ai_limits.rs -o .shots/local-ai-boundary-tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .shots/local-ai-boundary-tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record actual byte sizes and hashes
        shell: pwsh
        run: |
          node scripts/desktop-artifacts.mjs --require-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $manifest = Get-Content .shots/desktop-artifacts.json -Raw
          $manifest = $manifest.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
          Write-Host "::notice title=Windows artifact inventory::$manifest"
          # GitHub truncates long annotation messages; these ordered parts are recoverable.
          $raw = Get-Content .shots/desktop-artifacts.json -Raw
          $index = 0
          for ($offset = 0; $offset -lt $raw.Length; $offset += 2400) {
            $part = $raw.Substring($offset, [Math]::Min(2400, $raw.Length - $offset)).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host ("::notice title=Windows inventory part {0:D3}::{1}" -f $index, $part)
            $index++
          }
      - name: Install and launch smoke check (not full UI acceptance)
        shell: pwsh
        run: ./scripts/windows-install-smoke.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: previz-lab-windows-x64-unsigned
          if-no-files-found: error
          include-hidden-files: true
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/previz-lab.exe
            src-tauri/Cargo.lock
            .shots/desktop-artifacts.json
            .shots/windows-install-smoke.json
            .shots/windows-native-build.log
            .shots/loopback-build.log
            .shots/loopback-installed.json
            .shots/windows-ui-fixed.json
            .shots/windows-ui-baseline.json
            docs/windows-install-quickstart.md
            docs/desktop-local-ai.md
            docs/roads-elevation.md
