name: Repaired desktop installer verification
on:
  workflow_dispatch:
  push:
    branches: [arena/3f9ececc-bubbly-crab]
    paths: [.github/workflows/desktop-visual-verify.yml]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: previz-lab-windows-x64-unsigned
          run-id: 39562665642
          github-token: ${{ github.token }}
          path: .
      # Real release WebView2 CDP was unavailable in diagnostic runs; this gate
      # verifies installation/window only and explicitly reports visual=false.
      - name: Check repaired installation and native window
        shell: pwsh
        run: ./scripts/windows-install-smoke.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installed-ui-checks
          include-hidden-files: true
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/Cargo.lock
            .shots/desktop-artifacts.json
            .shots/windows-ui-*.json
            .shots/windows-install-smoke.json
