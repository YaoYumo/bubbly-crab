<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>3D Director Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234A4FB0'/%3E%3Cg stroke='%23fff' stroke-width='2.4' fill='none' stroke-linecap='round'%3E%3Cpath d='M5 10V6h4M27 6h4M5 22v4h4M27 26h4'/%3E%3C/g%3E%3Ccircle cx='16' cy='16' r='4.4' fill='%23fff'/%3E%3C/svg%3E">
<style>
  html,body{margin:0;height:100%;background:#F4EFE7;color:#1a1a2e;font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  #boot{position:fixed;inset:0;display:grid;place-items:center;background:#F4EFE7;z-index:99;letter-spacing:.2em;color:#8b90a0;text-align:center}
  #boot .hint{letter-spacing:0;font-size:12px;line-height:1.7;color:#5a5f72;max-width:56ch;margin-top:10px}
  #boot .hint b{color:#1a1a2e}
  #boot code{background:#EDE8DF;border:1px solid #D5CFC5;border-radius:4px;padding:1px 5px;color:#4A4FB0}
</style>
</head>
<body>
<div id="boot"><span id="boot-t">LOADING 3D DIRECTOR STUDIO…</span></div>
<script>
  window.__bootWatch = setTimeout(function () {
    if (window.__previzBooted) return;
    var box = document.getElementById('boot'); if (!box) return;
    var file = location.protocol === 'file:';
    document.getElementById('boot-t').innerHTML = '加载未完成'
      + '<div class="hint">'
      + (file
        ? '浏览器不允许以 <code>file://</code> 方式加载 <b>ES 模块</b>（这就是画面停在这里的原因）。两个办法：<br>① 直接打开同目录的 <b>previz-lab.html</b>（单文件版，无需任何服务器）；<br>② 在本目录执行 <code>npm install</code> 后 <code>npm run dev</code>，访问 <code>http://localhost:5173</code>。'
        : '如果长时间停在这里，通常是 dev 服务器已停止：在 <code>cameraref/</code> 里重新运行 <code>npm run dev</code>；'
          + '也可以改用仓库根目录的 <b>previz-lab.html</b> 单文件版（双击即可用）。')
      + '</div>';
  }, 3500);
</script>
<div id="app">
  <header id="top"></header>

  <!-- S1 Direct Page -->
  <div class="page on" id="page-direct">
    <aside id="left">
      <div class="ph"><b>Shots</b><span class="mini">机位列表</span></div>
      <div id="shot-list-direct"></div>
    </aside>
    <main id="viewport-shared">
      <div id="stage"></div>
      <div id="hud"></div>
      <div id="quickbar"></div>
    </main>
    <aside id="right"><div id="inspector"></div></aside>
  </div>

  <!-- S2 Scene Builder Page -->
  <div class="page" id="page-scene">
    <aside id="left-scene">
      <div class="ph"><b>Assets</b></div>
      <div id="library-scene"></div>
      <div id="objlist-scene"></div>
    </aside>
    <main id="viewport-scene">
      <div class="stage-mirror"></div>
      <div class="vp-overlay">
        <button class="vp-btn" id="scene-grid-toggle" title="切换网格">Grid</button>
        <button class="vp-btn" id="scene-snap-toggle" title="切换吸附">Snap</button>
      </div>
    </main>
    <aside id="right-scene"><div id="inspector-scene"></div></aside>
  </div>

  <!-- S3 Camera Path Page -->
  <div class="page" id="page-camera">
    <aside id="left-camera">
      <div class="ph"><b>Cameras</b>
        <div class="ph-btns">
          <button class="ib add" id="cam-add-btn" type="button" title="新建摄像机">＋</button>
          <button class="ib del" id="cam-del-btn" type="button" title="删除当前摄像机">✕</button>
        </div>
      </div>
      <div id="camera-list"></div>
      <div class="ph"><b>Keyframes</b></div>
      <div id="keyframes-list"></div>
    </aside>
    <main id="viewport-camera">
      <div class="stage-mirror"></div>
      <div class="cam-overlay-top">
        <select id="cam-switch-select" class="cam-switch" title="切换摄像机"></select>
        <span class="vp-sep"></span>
        <button class="vp-btn active" id="cam-persp-btn" title="透视视图">Persp</button>
        <button class="vp-btn" id="cam-top-btn" title="俯视图">Top</button>
        <button class="vp-btn" id="cam-path-btn" title="路径预览">Path</button>
      </div>
    </main>
    <aside id="right-camera"><div id="inspector-camera"></div></aside>
  </div>

  <!-- S4 Generate Page -->
  <div class="page" id="page-generate">
    <div id="generate-content" style="padding:24px;overflow:auto;flex:1"></div>
  </div>

  <!-- S5 Export Page -->
  <div class="page" id="page-export">
    <div id="export-content" style="padding:24px;overflow:auto;flex:1"></div>
  </div>

  <footer id="bottom"></footer>
</div>
<div id="modal"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
